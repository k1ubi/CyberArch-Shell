<svg width="100%" viewBox="0 0 800 130" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0C001F"/><stop offset="100%" stop-color="#060010"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.055"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#00FFF9" stop-opacity="0"/>
    <stop offset="25%"  stop-color="#00FFF9" stop-opacity="0.4"/>
    <stop offset="75%"  stop-color="#9B4DFF" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#FF00C8" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00FFF9"/>
    <stop offset="50%" stop-color="#9B4DFF"/>
    <stop offset="100%" stop-color="#FF00C8"/>
  </linearGradient>
</defs>
  <rect width="800" height="130" rx="8" fill="url(#bg)"/>
  <rect width="800" height="130" rx="8" fill="url(#sheen)"/>
  <rect width="800" height="1" y="0"      fill="url(#border)"/>
  <rect width="800" height="1" y="129"  fill="url(#border)" opacity="0.3"/>
  <text x="400" y="75" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="46" font-weight="bold"
        fill="url(#tg)" filter="url(#glow)">CyberArch</text>
  <text x="400" y="106" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="11" letter-spacing="1.5"
        fill="#00FFF9" opacity="0.45">Hyprland netrunner shell · AGS v3 / Astal · Arch</text>
</svg>